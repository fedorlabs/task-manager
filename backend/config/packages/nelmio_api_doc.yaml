nelmio_api_doc:
    documentation:
        info:
            title: Task Manager API
            description: REST API для учебного таск-менеджера
            version: 1.0.0
        securityDefinitions:
            Bearer:
                type: apiKey
                description: 'JWT токен авторизации. Формат: Bearer {token}'
                name: Authorization
                in: header
        security:
            - Bearer: []
    areas:
        path_patterns:
            - ^/(?!doc$|_error$)
