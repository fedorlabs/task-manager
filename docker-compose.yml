version: '3'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: 'trust'
      POSTGRES_PASSWORD: psql
    ports:
      - 5434:5432

  backend:
    build: ./backend
    command: bash /backend/docker-entrypoint.sh
    volumes:
      - ./backend:/backend
    depends_on:
      - db
    ports:
      - 3010:8000
    environment:
      APP_ENV: dev
      DATABASE_URL: 'postgresql://postgres:psql@db:5432/postgres?serverVersion=16&charset=utf8'
      JWT_PASSPHRASE: taskmanager

  frontend:
    build:
      context: ./frontend
    command: sh -c "npm rebuild esbuild && npm run dev"
    environment:
      PORT: '8080'
      HOST: '0.0.0.0'
    ports:
      - '8090:8080'
    volumes:
      - ./frontend:/frontend
