services:
  db:
    image: postgres:16
    env_file:
      - ./docker/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psql}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - '5434:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    command: bash /backend/docker-entrypoint.sh
    env_file:
      - ./docker/.env
    volumes:
      - ./backend:/backend
      - ./docker/backend/docker-entrypoint.sh:/backend/docker-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-psql}@db:5432/${POSTGRES_DB:-postgres}?serverVersion=16&charset=utf8'
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-taskmanager}

  backend-nginx:
    image: nginx:1.27-alpine
    ports:
      - '3010:8000'
    volumes:
      - ./backend:/backend:ro
      - ./docker/backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    command: sh -c "npm rebuild esbuild && npm run dev"
    env_file:
      - ./docker/.env
    environment:
      PORT: ${FRONTEND_PORT:-8080}
      HOST: ${FRONTEND_HOST:-0.0.0.0}
    ports:
      - '8090:8080'
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules

  nginx:
    image: nginx:1.27-alpine
    env_file:
      - ./docker/.env
    ports:
      - '8088:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-nginx
      - frontend

volumes:
  postgres_data:
